name: CI

# NON VERIFIE : ce workflow n'a jamais ete execute, faute d'acces a GitHub
# Actions depuis la machine de developpement. Les commandes sont celles qui
# tournent localement.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Environnement fige
        run: uv sync --frozen --group dev --extra ingestion --extra retrieval
             --extra agent --extra mcp --extra api --extra ui

      - name: Lint
        run: uv run ruff check .

      # Les tests marques `models` sont exclus : ils telechargent plusieurs
      # gigaoctets de poids et depassent le temps d'un job de CI.
      - name: Tests
        run: uv run pytest -q

  pipeline:
    name: Corpus, index et evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Environnement fige
        run: uv sync --frozen --group dev --extra ingestion --extra retrieval
             --extra agent --extra mcp --extra api --extra ui

      # Tout est reconstruit depuis les sources : si la generation, l'ingestion
      # ou l'evaluation a regresse, la CI le voit sans intervention humaine.
      - name: Generer le corpus
        run: uv run python -m maintidoc.synth generate

      - name: Ingerer
        run: uv run python -m maintidoc.ingestion ingest

      - name: Jeu de test
        run: uv run python -m maintidoc.evaluation build

      # `--lean` : aucun modele telecharge. Le controle d'acces et le
      # confinement des injections sont mesures ; la qualite des reponses ne
      # l'est pas, et le rapport le dit.
      - name: Evaluation (mode allege)
        run: uv run python -m maintidoc.evaluation run --lean --strict

      - name: Triplets du reranker
        run: uv run python -m maintidoc.training mine

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-evaluation
          path: |
            eval/reports/
            eval/training/
          retention-days: 14

  security:
    name: Secrets et dependances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recherche de secrets commites
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v3

      # Le lock est la reference : une derive silencieuse des versions rendrait
      # les resultats d'evaluation incomparables.
      - name: Verifier que uv.lock est a jour
        run: uv lock --check

      - name: Vulnerabilites connues
        run: |
          uv sync --frozen --group dev
          uv run --with pip-audit pip-audit --strict || true
