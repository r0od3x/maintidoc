# Pile complete MaintiDoc.
#
#   cp .env.example .env     # renseigner les secrets
#   docker compose up -d
#   docker compose run --rm ingest        # corpus -> elements -> index
#
# NON VERIFIE : aucun moteur Docker n'etait disponible sur la machine de
# developpement. Les images n'ont jamais ete construites ni demarrees. A
# valider avant de s'en servir pour la demonstration.
#
# Aucun secret en dur : tout vient de .env, exclu de Git.

name: maintidoc

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment:
    MAINTIDOC_QDRANT_URL: http://qdrant:6333
    MAINTIDOC_QDRANT_LOCAL: "false"
    MAINTIDOC_POSTGRES_DSN: postgresql://maintidoc:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}@postgres:5432/maintidoc
    MAINTIDOC_MINIO_ENDPOINT: http://minio:9000
    MAINTIDOC_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?definir MINIO_ROOT_USER}
    MAINTIDOC_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?definir MINIO_ROOT_PASSWORD}
    MAINTIDOC_JWT_SECRET: ${MAINTIDOC_JWT_SECRET:?definir MAINTIDOC_JWT_SECRET}
    MAINTIDOC_OLLAMA_HOST: http://ollama:11434
    MAINTIDOC_VLM_MODEL: ${MAINTIDOC_VLM_MODEL:-qwen2.5vl:7b}
    MAINTIDOC_CORPUS_VERSION: ${MAINTIDOC_CORPUS_VERSION:-2026.11}
    MAINTIDOC_INDEX_VERSION: ${MAINTIDOC_INDEX_VERSION:-2026.11}
    MAINTIDOC_TESSERACT_CMD: /usr/bin/tesseract
    MLFLOW_TRACKING_URI: http://mlflow:5000
    HF_HOME: /models
  volumes:
    - corpus_derived:/app/corpus/derived
    - models_cache:/models

services:
  # --- donnees ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maintidoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}
      POSTGRES_DB: maintidoc
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintidoc"]
      interval: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10

  # --- modeles ----------------------------------------------------------
  ollama:
    image: ollama/ollama:0.5.4
    ports: ["11434:11434"]
    volumes: ["ollama_models:/root/.ollama"]
    # Le modele est telecharge au premier demarrage :
    #   docker compose exec ollama ollama pull qwen2.5vl:7b
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow"]

  # --- application ------------------------------------------------------
  api:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    ports: ["8000:8000"]
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      ollama: {condition: service_started}
    restart: unless-stopped

  ui:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ui
    environment:
      MAINTIDOC_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped

  # --- travaux ponctuels (profil `jobs`) --------------------------------
  ingest:
    <<: *app
    profiles: ["jobs"]
    command: >
      sh -c "python -m maintidoc.synth generate &&
             python -m maintidoc.ingestion ingest --ocr &&
             python -m maintidoc.retrieval build"
    depends_on:
      qdrant: {condition: service_healthy}

  evaluate:
    <<: *app
    profiles: ["jobs"]
    command: >
      sh -c "python -m maintidoc.evaluation build &&
             python -m maintidoc.evaluation run --strict"
    depends_on:
      qdrant: {condition: service_healthy}

volumes:
  qdrant_data:
  postgres_data:
  minio_data:
  ollama_models:
  mlflow_data:
  corpus_derived:
  models_cache:
